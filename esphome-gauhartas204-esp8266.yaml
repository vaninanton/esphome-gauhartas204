esphome:
  name: esphome-gauhartas204
  friendly_name: ESPHome Gauhartas 204
  # Подустройства по комнатам — в HA каждое отобразится отдельным устройством в своей зоне
  devices:
    - id: device_bathroom
      name: "Ванная"
      area_id: area_bathroom
    - id: device_bathroom_hall
      name: "Холл ванной"
      area_id: area_bathroom_hall
    - id: device_kitchen
      name: "Кухня"
      area_id: area_kitchen
    - id: device_lobby
      name: "Прихожая"
      area_id: area_lobby
    - id: device_living_room
      name: "Гостиная"
      area_id: area_living_room
    - id: device_sleeping_room
      name: "Спальня"
      area_id: area_sleeping_room
    - id: device_balcony
      name: "Балкон"
      area_id: area_balcony
    - id: device_wardrobe
      name: "Гардеробная"
      area_id: area_wardrobe
    - id: device_common
      name: "Управление"
      area_id: area_lobby
  areas:
    - id: area_bathroom
      name: "Ванная"
    - id: area_bathroom_hall
      name: "Холл ванной"
    - id: area_kitchen
      name: "Кухня"
    - id: area_lobby
      name: "Прихожая"
    - id: area_living_room
      name: "Гостиная"
    - id: area_sleeping_room
      name: "Спальня"
    - id: area_balcony
      name: "Балкон"
    - id: area_wardrobe
      name: "Гардеробная"
  project:
    name: vaninanton.esphome-gauhartas204
    version: dev  # replaced by GitHub workflows with release version
  comment: "https://github.com/vaninanton/esphome-gauhartas204"

dashboard_import:
  package_import_url: github://vaninanton/esphome-gauhartas204/esphome-gauhartas204-esp8266.yaml@main

external_components:
  - source:
      type: local
      path: components
    components: [uart_read_line]

esp8266:
  board: d1_mini
  framework:
    version: recommended

globals:
  # Время последнего ответа контроллера (*RA / *RK) — для датчика «Контроллер отвечает»
  - id: last_controller_response_millis
    type: uint32_t
    initial_value: "0"
  # Последняя активность по источникам статуса: [0] — *RA 1, [1] — *RA 2, [2] — *RK WM.
  # Обновляется и ответом, и отправленным запросом; 0 — активности ещё не было.
  - id: status_activity_millis
    type: std::array<uint32_t, 3>

# To be able to get logs from the device via serial and api.
logger:
  baud_rate: 0

# API is a requirement of the dashboard import.
api:
  actions:
    # Подсветка клавиш выключателей: esphome.esphome_gauhartas204_set_backlight
    # codes — коды клавиш (как в событиях нажатий, например "100601"), state — зажечь/погасить.
    # Выключатель слушает шину сам; номер модуля в команде ему не важен.
    # Контроллер перезаписывает подсветку клавиши, когда переключает связанное с ней реле.
    - action: set_backlight
      variables:
        codes: string[]
        state: bool
      then:
        - script.execute:
            id: send_backlight
            codes: !lambda "return codes;"
            state: !lambda "return state;"

    # Состояние датчика протечки (раньше его сообщал сервис на Raspberry Pi по данным облака Xiaomi):
    # esphome.esphome_gauhartas204_set_water_sensor_state, state — ok | alarm | offline | low_battery.
    # Внимание: ok шлёт *WM ON$, то есть открывает клапан; это же единственный выход из режима offline.
    - action: set_water_sensor_state
      variables:
        state: string
      then:
        - script.execute:
            id: send_water_sensor_state
            state: !lambda "return state;"

script:
  - id: send_water_sensor_state
    parameters:
      state: string
    then:
      - lambda: |-
          const char *cmd = nullptr;
          if (state == "ok") cmd = "*WM ON$\r\n";
          else if (state == "alarm") cmd = "*WM ALR$\r\n";
          else if (state == "offline") cmd = "*WM WSD$\r\n";
          else if (state == "low_battery") cmd = "*RK WM LOW$\r\n";
          if (cmd == nullptr) {
            ESP_LOGW("gauhartas", "send_water_sensor_state: неизвестное состояние '%s'", state.c_str());
            return;
          }
          ESP_LOGD("gauhartas", "Датчик протечки: %s", state.c_str());
          id(uart_bus).write_str(cmd);

  # Кадры *RK 1 <код> <0|1> $ уходят одной строкой: выключатели делят поток по '*'/'$'.
  # Пустой список codes — все клавиши квартиры (кнопки «Подсветка: включить/выключить всё»).
  - id: send_backlight
    parameters:
      codes: string[]
      state: bool
    then:
      - lambda: |-
          // Выключатели с подсветкой: 1000–1010 без отсутствующего 1004
          static const char *const ALL_SWITCHES[] = {"1000", "1001", "1002", "1003", "1005",
                                                     "1006", "1007", "1008", "1009", "1010"};
          const char *const suffix = state ? " 1 $" : " 0 $";
          std::string out;
          out.reserve((codes.empty() ? 21 : codes.size()) * 16 + 2);
          auto append = [&](const char *code, size_t len) {
            out.append("*RK 1 ", 6);
            out.append(code, len);
            out.append(suffix, 4);
          };
          if (codes.empty()) {
            for (const char *num : ALL_SWITCHES) {
              for (const char *key : {"01", "04"}) {
                out.append("*RK 1 ", 6);
                out.append(num, 4);
                out.append(key, 2);
                out.append(suffix, 4);
              }
            }
            append("100206", 6);  // индикатор «выключить всё» у кровати
          } else {
            for (const auto &code : codes) {
              if (code.size() != 6 || code.find_first_not_of("0123456789") != std::string::npos) {
                ESP_LOGW("gauhartas", "set_backlight: неверный код клавиши '%s'", code.c_str());
                continue;
              }
              append(code.c_str(), code.size());
            }
          }
          if (out.empty())
            return;
          out.append("\r\n", 2);
          id(uart_bus).write_str(out.c_str());

# OTA: через ESPHome (Dashboard/HA) и по манифесту с GitHub Pages (релизы)
ota:
  - platform: esphome
  - platform: http_request
    id: ota_http

http_request:
  useragent: ESPHome/1.0
  verify_ssl: false  # ESP8266 не поддерживает проверку сертификатов
  # По умолчанию буфер приёма TLS — 512 байт: ответ больше одной записи не читается
  # («Stream pointer vanished»), а GitHub Pages не умеет согласовывать размер фрагмента
  # 4 КБ хватает, чтобы прочитать манифест (он влезает в одну TLS-запись).
  # Сама прошивка по HTTPS не скачивается: для её записей нужно 16 КБ, а столько
  # свободной памяти на ESP8266 нет — обновление ставится через ESPHome Dashboard.
  tls_buffer_size_rx: 4096

update:
  - platform: http_request
    id: github_update
    name: Обновление с GitHub Release
    source: https://vaninanton.github.io/esphome-gauhartas204/manifest.json
    update_interval: 6h
    entity_category: config

wifi:
  min_auth_mode: WPA2
  # Set up a wifi access point using the device name above
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

web_server:
  port: 80
  version: 3

uart:
  - id: uart_bus
    baud_rate: 19200
    tx_pin: GPIO1
    rx_pin: GPIO3

switch:
  # - platform: uart
  #   name: "prt10"
  #   id: "prt10"
  #   data:
  #     turn_on: "*1 PRT 0 1 $\r\n"
  #     turn_off: "*1 PRT 0 0 $\r\n"

