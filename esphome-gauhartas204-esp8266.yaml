button:
  - platform: uart
    name: "Выключить всё"
    data: "*999998$\r\n"
    id: "alloff"
    device_id: device_common
    icon: "mdi:power"
    entity_category: config

  # Вода перекрывается, сигнал об утечке
  - platform: uart
    entity_category: config
    name: "wm_alr"
    device_id: device_common
    data: "*WM ALR$\r\n"

  # - platform: uart
  #   entity_category: config
  #   name: "wm_on"
  #   device_id: device_common
  #   data: "*WM ON$\r\n"

  # - platform: uart
  #   entity_category: config
  #   name: "wm_off"
  #   device_id: device_common
  #   data: "*WM OFF$\r\n"

  # - platform: uart
  #   entity_category: config
  #   name: "wm_wsd"
  #   data: "*WM WSD$\r\n"

  # - platform: uart
  #   entity_category: config
  #   name: "rk_wm_low"
  #   data: "*RK WM LOW$\r\n"

  - platform: uart
    entity_category: config
    name: "wm_reb"
    device_id: device_common
    data: "*WM REB$\r\n"

  - platform: template
    name: "Подсветка: включить всё"
    device_id: device_common
    icon: "mdi:led-on"
    on_press:
      - script.execute:
          id: send_backlight
          codes: !lambda "return {};"  # пустой список — вся квартира
          state: true

  - platform: template
    name: "Подсветка: выключить всё"
    device_id: device_common
    icon: "mdi:led-off"
    on_press:
      - script.execute:
          id: send_backlight
          codes: !lambda "return {};"  # пустой список — вся квартира
          state: false

  - platform: template
    name: "Проверить обновление"
    device_id: device_common
    icon: "mdi:cloud-search-outline"
    entity_category: config
    on_press:
      - update.check: github_update

  - platform: restart
    entity_category: config
    name: "Restart ESPHOME"
    device_id: device_common

# Отправка произвольной команды в шину (для отладки протокола); \r\n добавляется автоматически
text:
  - platform: template
    name: "UART команда"
    device_id: device_common
    entity_category: config
    mode: text
    max_length: 100  # можно отправить несколько кадров подряд
    optimistic: true
    set_action:
      - lambda: |-
          id(uart_bus).write_str(x.c_str());
          id(uart_bus).write_str("\r\n");

valve:
  - platform: template
    name: "water"
    id: "rkwm"
    device_id: device_bathroom
    device_class: water
    icon: "mdi:water"
    optimistic: false
    has_position: false
    open_action:
      - uart.write:
          data: "*WM ON$\r\n"
    close_action:
      - uart.write:
          data: "*WM OFF$\r\n"

# Нажатия физических выключателей. Выключатель шлёт в шину *10XXYY$, где XX — номер выключателя,
# YY — клавиша: 01/04 — короткое нажатие верхней/нижней (тип события — что переключает клавиша),
# 02/05 — двойное (UpperDouble/LowerDouble), 03/06 — долгое (UpperLong/LowerLong).
# Сопоставление кодов с событиями — в лямбде text_sensor ниже.
event:
  # В холле ванной: обе клавиши переключают свет в гардеробной
  - platform: template
    id: switch_1000
    name: "Выключатель 1000"
    device_id: device_bathroom_hall
    device_class: button
    event_types: [SleepingroomWardrobe, SleepingroomWardrobeLower, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1001
    name: "Выключатель 1001"
    device_id: device_kitchen
    device_class: button
    event_types: [KitchenTable, KitchenLight, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1002
    name: "Выключатель 1002"
    device_id: device_sleeping_room
    device_class: button
    event_types: [SleepingroomLight, SleepingroomLeft, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1003
    name: "Выключатель 1003"
    device_id: device_bathroom_hall
    device_class: button
    # Клавиша 04 переключает порт 0 модуля 1, к которому ничего не подключено, — удобна для автоматизаций HA
    event_types: [BathroomHall, Key04, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1005
    name: "Выключатель 1005"
    device_id: device_bathroom
    device_class: button
    event_types: [BathroomLight, BathroomSubLight, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1006
    name: "Выключатель 1006"
    device_id: device_lobby
    device_class: button
    event_types: [LobbyLight, MasterOff, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1007
    name: "Выключатель 1007"
    device_id: device_sleeping_room
    device_class: button
    event_types: [SleepingroomLight, LivingroomLight, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1008
    name: "Выключатель 1008"
    device_id: device_balcony
    device_class: button
    # Обе клавиши переключают свет на балконе
    event_types: [BalconyLight, BalconyLightLower, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1009
    name: "Выключатель 1009"
    device_id: device_living_room
    device_class: button
    event_types: [LivingroomLight, LivingroomSubLight, UpperLong, LowerLong, UpperDouble, LowerDouble]
  - platform: template
    id: switch_1010
    name: "Выключатель 1010"
    device_id: device_wardrobe
    device_class: button
    # В гардеробной: обе клавиши переключают свет в гардеробной
    event_types: [SleepingroomWardrobe, SleepingroomWardrobeLower, UpperLong, LowerLong, UpperDouble, LowerDouble]
  # Выключатель воды: такой же, как остальные, но с синим и красным светодиодами и пищалкой.
  # Шлёт в шину те же команды, что и ESP: *WM ON$ / *WM OFF$
  - platform: template
    id: water_button
    name: "Выключатель воды"
    device_id: device_bathroom
    device_class: button
    event_types: ["ON", "OFF"]

# Сенсор, считывающий ответы из UART
text_sensor:
  - platform: uart_read_line
    id: uart_readline_sensor
    uart_id: uart_bus
    name: "latestSerial"
    entity_category: "diagnostic"
    on_value:
      - lambda: |-
          // Пакет: '*' ... '$' (хвостовые пробелы игнорируются)
          const char *b = x.c_str();
          size_t len = x.size();
          while (len > 0 && (b[len-1] == ' ' || b[len-1] == '\t')) { len--; }
          const bool framed = len >= 2 && b[0] == '*' && b[len-1] == '$';
          // Любой кадр *RA/*RK приходит от контроллера — значит, он жив
          if (framed && (x.compare(0, 4, "*RA ") == 0 || x.compare(0, 4, "*RK ") == 0))
            id(last_controller_response_millis) = millis();
          // *RA <модуль> <p0> <p1> ... <p7> $ — состояние порта N в позиции 6 + 2*N
          const bool is_ra = framed && len >= 21 && x.compare(0, 4, "*RA ") == 0 && b[5] == ' ';
          if (is_ra && b[4] == '1') {
            id(BathroomLight).publish_state(b[8] == '1');
            id(BathroomHall).publish_state(b[10] == '1');
            id(KitchenLight).publish_state(b[12] == '1');
            id(KitchenTable).publish_state(b[14] == '1');
            id(LobbyLight).publish_state(b[16] == '1');
            id(LivingroomSubLight).publish_state(b[18] == '1');
            id(BathroomSubLight).publish_state(b[20] == '1');
            id(status_activity_millis)[0] = millis();
          } else if (is_ra && b[4] == '2') {
            id(SleepingroomRight).publish_state(b[8] == '1');
            id(BalconyLight).publish_state(b[10] == '1');
            id(SleepingroomLight).publish_state(b[12] == '1');
            id(SleepingroomLeft).publish_state(b[16] == '1');
            id(LivingroomLight).publish_state(b[18] == '1');
            id(SleepingroomWardrobe).publish_state(b[20] == '1');
            id(status_activity_millis)[1] = millis();
          } else if (framed && x.compare(0, 7, "*RK WM ") == 0) {
            // *RK WM <состояние>$: ON — открыт, OFF/ALR — закрыт, прочие состояние клапана не меняют
            size_t end = len - 1;
            while (end > 7 && b[end-1] == ' ') { end--; }
            const std::string state = x.substr(7, end - 7);
            if (id(water_module_state).state != state)
              id(water_module_state).publish_state(state);
            if (state == "ON" || state == "OFF" || state == "ALR") {
              const float position = (state == "ON") ? valve::VALVE_OPEN : valve::VALVE_CLOSED;
              if (id(rkwm).position != position) {
                id(rkwm).position = position;
                id(rkwm).publish_state();
              }
            }
            id(status_activity_millis)[2] = millis();
          } else if (framed && x.compare(0, 4, "*RK ") == 0) {
            // *RK <модуль> <кнопка> <0|1> $ — подсветка клавиши; отдельно обрабатывать нечего
          } else if (framed && len == 8 && std::all_of(b + 1, b + 7, [](char c) { return c >= '0' && c <= '9'; })) {
            // *10XXYY$ — нажатие клавиши выключателя XX. YY: 01/04 — короткое нажатие верхней/нижней,
            // 02/05 — двойное, 03/06 — долгое (контроллер реагирует только на короткие и на 06 у выключателей у кровати)
            struct Switch { const char *num; event::Event *ev; const char *upper; const char *lower; };
            static const Switch switches[] = {
              {"1000", id(switch_1000), "SleepingroomWardrobe", "SleepingroomWardrobeLower"},
              {"1001", id(switch_1001), "KitchenTable", "KitchenLight"},
              {"1002", id(switch_1002), "SleepingroomLight", "SleepingroomLeft"},
              {"1003", id(switch_1003), "BathroomHall", "Key04"},
              {"1005", id(switch_1005), "BathroomLight", "BathroomSubLight"},
              {"1006", id(switch_1006), "LobbyLight", "MasterOff"},
              {"1007", id(switch_1007), "SleepingroomLight", "LivingroomLight"},
              {"1008", id(switch_1008), "BalconyLight", "BalconyLightLower"},
              {"1009", id(switch_1009), "LivingroomLight", "LivingroomSubLight"},
              {"1010", id(switch_1010), "SleepingroomWardrobe", "SleepingroomWardrobeLower"},
            };
            const char *type = nullptr;
            event::Event *ev = nullptr;
            for (const auto &sw : switches) {
              if (x.compare(1, 4, sw.num) != 0) continue;
              ev = sw.ev;
              if (b[5] == '0') {
                switch (b[6]) {
                  case '1': type = sw.upper; break;
                  case '4': type = sw.lower; break;
                  case '2': type = "UpperDouble"; break;
                  case '5': type = "LowerDouble"; break;
                  case '3': type = "UpperLong"; break;
                  case '6': type = "LowerLong"; break;
                }
              }
              break;
            }
            if (type != nullptr) {
              ev->trigger(type);
            } else {
              ESP_LOGW("gauhartas", "Неизвестная клавиша выключателя: %s", x.c_str());
              id(latestSerialUnknown).publish_state(x);
            }
          } else if (len == 7 && x.compare(0, 7, "*WM ON$") == 0) {
            // Выключатель воды; состояние клапана придёт следом ответом *RK WM
            id(water_button).trigger("ON");
          } else if (len == 8 && x.compare(0, 8, "*WM OFF$") == 0) {
            id(water_button).trigger("OFF");
          } else {
            id(latestSerialUnknown).publish_state(x);
          }
  # Последнее состояние модуля воды: ON, OFF, ALR (протечка), WSD (нет связи с датчиком), LOW (батарейка)
  - platform: template
    name: "Состояние модуля воды"
    id: water_module_state
    device_id: device_bathroom
    icon: "mdi:water-check"
    entity_category: diagnostic
  - platform: template
    name: "latestSerialUnknown"
    id: latestSerialUnknown
    entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"

# Контроллер отвечает = получен *RA или *RK не более 5 мин назад.
# Состояние публикуется из interval раз в 30 с.
binary_sensor:
  # Датчик протечки живёт в HA (Zigbee): подписываемся на него через API и при протечке
  # шлём модулю воды тревогу — он перекрывает воду. Обратно вода открывается только вручную.
  - platform: homeassistant
    id: leak_sensor
    name: "Датчик протечки (из HA)"
    entity_id: binary_sensor.wleak_kitchen_leak
    internal: false  # у платформы homeassistant по умолчанию true
    device_id: device_bathroom
    device_class: moisture
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: send_water_sensor_state
          state: alarm

  - platform: template
    name: "Контроллер отвечает"
    id: controller_responding
    device_class: connectivity
    entity_category: "diagnostic"

sensor:
  - platform: wifi_signal
    name: "Wi‑Fi сигнал"
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    name: "Uptime"
    entity_category: "diagnostic"

interval:
  - interval: 30s
    then:
      - lambda: |-
          uint32_t last = id(last_controller_response_millis);
          id(controller_responding).publish_state((last != 0U) && ((millis() - last) < 300000U));
  # Запрос статуса — через 120 с после последнего ответа от этого источника
  # (ответы на нажатия выключателей тоже считаются) и не чаще раза в 120 с, если контроллер молчит.
  # За одну проверку уходит не больше одного запроса, поэтому между запросами не меньше 3 с.
  - interval: 3s
    then:
      - lambda: |-
          static const char *const requests[] = {"*1 STS$", "*2 STS$", "*WM INF$"};
          static const uint32_t PERIOD = 120000;
          const uint32_t now = millis();
          auto &last = id(status_activity_millis);
          for (size_t i = 0; i < 3; i++) {
            if (last[i] == 0 || now - last[i] >= PERIOD) {
              ESP_LOGD("gauhartas", "Запрос статуса: %s", requests[i]);
              id(uart_bus).write_str(requests[i]);
              id(uart_bus).write_str("\r\n");
              last[i] = now;
              break;
            }
          }

status_led:
  pin:
    number: D4
    inverted: true