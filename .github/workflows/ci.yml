name: CI

on:
  push:
    branches:
      - main
    paths:
      - '*.yaml'
      - 'components/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '*.yaml'
      - 'components/**'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (ESPHome ${{ matrix.esphome-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable — как в publish-firmware.yml; beta добавляется в ночном прогоне,
        # чтобы заранее ловить поломки следующего релиза ESPHome, но не удваивать сборку на каждый PR
        esphome-version: ${{ github.event_name == 'schedule' && fromJSON('["stable", "beta"]') || fromJSON('["stable"]') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Build
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome-gauhartas204-esp8266.yaml
          version: ${{ matrix.esphome-version }}
