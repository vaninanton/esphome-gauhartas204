name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Publish Firmware
    types:
      - completed
  pull_request:
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - run: mkdir -p output/firmware

      - name: Build
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./static
          destination: ./output

      - name: Fetch firmware files
        uses: robinraju/release-downloader@v1.11
        continue-on-error: true
        with:
          latest: true
          fileName: '*.ota.bin'
          out-file-path: output/firmware

      - name: Generate OTA manifest
        run: |
          F=$(ls output/firmware/*.ota.bin 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            FNAME=$(basename "$F")
            MD5=$(md5sum "$F" | awk '{print $1}')
            VER=$(echo "$FNAME" | sed -n 's/.*-\([0-9].*\)\.ota\.bin/\1/p')
            [ -z "$VER" ] && VER=$(echo "$FNAME" | sed 's/\.ota\.bin//')
            cat > output/manifest.json << EOF
          {
            "name": "ESPHome Gauhartas 204",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP8266",
                "ota": {
                  "md5": "$MD5",
                  "path": "firmware/$FNAME",
                  "release_url": "https://github.com/${{ github.repository }}/releases",
                  "summary": "Release $VER"
                }
              }
            ]
          }
          EOF
          else
            echo '{"name":"ESPHome Gauhartas 204","version":"0.0.0","builds":[]}' > output/manifest.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: output
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
