name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Publish Firmware
    types:
      - completed
  pull_request:
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # После релиза — только если прошивка собралась и загрузилась
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      # Каталог нужно создать до Jekyll: он работает в докере от root и делает output/
      # своим, после чего release-downloader (от runner) не может создать в нём подкаталог
      - run: mkdir -p output/firmware

      - name: Build
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./static
          destination: ./output

      - name: Fetch firmware files
        uses: robinraju/release-downloader@v1.11
        with:
          latest: true
          fileName: '*'
          out-file-path: output/firmware

      # Устройства берут манифест из корня сайта (update.source в YAML), страница установки — тоже.
      # Берём манифест релиза как есть и делаем все пути относительными к корню.
      - name: Generate manifest
        run: |
          manifests=(output/firmware/*.manifest.json)
          if [ ${#manifests[@]} -ne 1 ]; then
            echo "Ожидался ровно один манифест, найдено: ${manifests[*]}" >&2
            exit 1
          fi
          jq '(.builds[].ota.path, .builds[].parts[].path) |= "firmware/" + .' \
            "${manifests[0]}" > output/manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: output
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
